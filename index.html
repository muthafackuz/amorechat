<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amore Club | VIP Chat & Profiles</title>
    <script src="https://tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-gradient-to-br from-slate-950 via-purple-950 to-slate-950 h-screen flex flex-col items-center justify-center p-4 font-sans text-slate-100">

    <!-- ЕКРАН ЗА ВХОД И РЕГИСТРАЦИЯ -->
    <div id="auth-screen" class="bg-slate-900/90 backdrop-blur-md p-8 rounded-3xl shadow-2xl w-full max-w-md border border-purple-500/20 max-h-[95vh] overflow-y-auto">
        <h2 id="auth-title" class="text-3xl font-extrabold mb-2 text-center bg-gradient-to-r from-purple-400 to-pink-500 bg-clip-text text-transparent">Amore Club</h2>
        <p id="auth-subtitle" class="text-xs text-slate-400 text-center mb-6">Влез или си създай профил веднага</p>
        
        <div class="space-y-3">
            <input id="email-input" type="email" placeholder="Имейл адрес..." class="w-full p-3.5 bg-slate-800/60 border border-slate-700 rounded-xl focus:outline-none focus:border-purple-500 text-white placeholder-slate-500">
            <input id="password-input" type="password" placeholder="Парола..." class="w-full p-3.5 bg-slate-800/60 border border-slate-700 rounded-xl focus:outline-none focus:border-purple-500 text-white placeholder-slate-500">
            
            <!-- Допълнителни полета за регистрация -->
            <div id="register-fields" class="hidden space-y-3 pt-2 border-t border-slate-800">
                <input id="nickname-input" type="text" placeholder="Потребителско име (Ник)..." class="w-full p-3.5 bg-slate-800/60 border border-slate-700 rounded-xl focus:outline-none focus:border-purple-500 text-white placeholder-slate-500">
                <div class="flex gap-2">
                    <input id="age-input" type="number" placeholder="Години..." class="w-1/2 p-3.5 bg-slate-800/60 border border-slate-700 rounded-xl focus:outline-none focus:border-purple-500 text-white placeholder-slate-500">
                    <select id="gender-input" class="w-1/2 p-3.5 bg-slate-800/60 border border-slate-700 rounded-xl focus:outline-none focus:border-purple-500 text-white text-slate-400">
                        <option value="Мъж">Мъж 🧑</option>
                        <option value="Жена">Жена 👩</option>
                        <option value="Друго">Тайна 🤫</option>
                    </select>
                </div>
                <input id="avatar-input" type="text" placeholder="Линк за профилна снимка (незадължително)..." class="w-full p-3.5 bg-slate-800/60 border border-slate-700 rounded-xl focus:outline-none focus:border-purple-500 text-white placeholder-slate-500">
                <textarea id="info-input" placeholder="Кратко инфо за мен..." class="w-full p-3.5 bg-slate-800/60 border border-slate-700 rounded-xl focus:outline-none focus:border-purple-500 text-white h-20 placeholder-slate-500 resize-none"></textarea>
            </div>
        </div>

        <button onclick="handleAuth()" id="main-auth-btn" class="w-full bg-gradient-to-r from-purple-600 to-pink-600 text-white p-4 rounded-xl font-bold mt-6 hover:from-purple-500 hover:to-pink-500 shadow-lg shadow-purple-500/20 transition">Влизане</button>
        
        <p class="text-center text-xs text-slate-400 mt-4">
            <span id="switch-text">Нямаш профил?</span> 
            <button onclick="toggleAuthMode()" id="switch-btn" class="text-purple-400 font-bold hover:underline">Регистрирай се тук</button>
        </p>
    </div>
    <!-- ОСНОВЕН ЕКРАН НА ЧАТ СТАЯТА -->
    <div id="chat-screen" class="hidden bg-slate-900/90 backdrop-blur-md rounded-3xl shadow-2xl w-full max-w-4xl h-[85vh] flex overflow-hidden border border-purple-500/20 animate-fade-in">
        <div class="flex-1 flex flex-col h-full border-r border-slate-800">
            <div class="bg-gradient-to-r from-purple-900 to-indigo-900 p-4 font-bold flex justify-between items-center">
                <span class="flex items-center gap-2"><span class="w-2.5 h-2.5 bg-emerald-500 rounded-full animate-pulse"></span> 🔮 Amore VIP Chat</span>
                <span id="user-badge" class="text-xs bg-purple-500/20 border border-purple-500/40 px-3 py-1 rounded-full font-mono"></span>
            </div>
            
            <div id="messages-container" class="flex-1 p-5 overflow-y-auto space-y-3.5 bg-slate-950/50"></div>

            <div class="p-4 bg-slate-900/40 flex gap-3 border-t border-slate-800">
                <input id="message-input" type="text" placeholder="Напиши нещо в стаята..." class="flex-1 p-3.5 bg-slate-800/40 border border-slate-700/60 rounded-xl focus:outline-none focus:border-purple-500 text-white" onkeypress="if(event.key==='Enter') sendMessage()">
                <button onclick="sendMessage()" class="bg-gradient-to-r from-purple-600 to-pink-600 text-white px-7 rounded-xl font-bold hover:from-purple-500 hover:to-pink-500 transition">Прати</button>
            </div>
        </div>
    </div>

    <!-- ПОП-ЪП ЗА ПРЕГЛЕД НА ПРОФИЛ И АДМИН ПАНЕЛ -->
    <div id="profile-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-purple-500/30 p-6 rounded-3xl w-full max-w-sm text-center relative">
            <button onclick="closeProfile()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-xl">✕</button>
            <img id="modal-avatar" src="" class="w-24 h-24 rounded-full mx-auto border-2 border-purple-500 object-cover mb-4">
            <h3 id="modal-name" class="text-2xl font-bold text-white mb-1"></h3>
            <div class="flex justify-center gap-3 text-xs text-slate-400 mb-4">
                <span id="modal-age"></span>
                <span id="modal-gender"></span>
            </div>
            <p id="modal-info" class="text-sm text-slate-300 bg-slate-950/50 p-4 rounded-xl italic mb-6 text-left border border-slate-800"></p>
            
            <!-- СКРИТИ АДМИН БУТОНИ -->
            <div id="admin-controls" class="hidden border-t border-slate-800 pt-4 space-y-2">
                <p class="text-[10px] text-red-400 font-bold uppercase tracking-wider mb-2">👮 Админ Контрол Панел</p>
                <div class="flex gap-2">
                    <button onclick="adminAction('kick')" class="flex-1 bg-amber-600/20 text-amber-400 border border-amber-500/30 py-2 rounded-xl text-xs font-bold hover:bg-amber-600/40 transition">Kick</button>
                    <button onclick="adminAction('mute')" class="flex-1 bg-orange-600/20 text-orange-400 border border-orange-500/30 py-2 rounded-xl text-xs font-bold hover:bg-orange-600/40 transition">Mute</button>
                    <button onclick="adminAction('ban')" class="flex-1 bg-red-600 text-white py-2 rounded-xl text-xs font-bold hover:bg-red-700 transition">BAN</button>
                </div>
            </div>
        </div>
    </div>

    <audio id="msg-sound" src="https://mixkit.co" preload="auto"></audio>
    <!-- Свързване на Firebase директно през браузъра (v9 модулна версия) -->
    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://gstatic.com";
        import { getFirestore, doc, setDoc, getDoc } from "https://gstatic.com";

        // 🔐 Твоите лични реални ключове от Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAECHxZNoWBbpx-eg1HvAGOfuOLSI4j4ho",
            authDomain: "://firebaseapp.com",
            projectId: "amorechat-77ecf",
            storageBucket: "amorechat-77ecf.firebasestorage.app",
            messagingSenderId: "830014963598",
            appId: "1:830014963598:web:6117bdb8f952bb7cccaedf"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const socket = io();
        let isRegisterMode = false;
        let myProfile = null;
        let activeProfileView = null;

        window.toggleAuthMode = function() {
            isRegisterMode = !isRegisterMode;
            document.getElementById('register-fields').classList.toggle('hidden', !isRegisterMode);
            document.getElementById('auth-title').innerText = isRegisterMode ? 'Регистрация' : 'Amore Club';
            document.getElementById('main-auth-btn').innerText = isRegisterMode ? 'Създай профил' : 'Влизане';
            document.getElementById('switch-text').innerText = isRegisterMode ? 'Вече имаш профил?' : 'Нямаш профил?';
            document.getElementById('switch-btn').innerText = isRegisterMode ? 'Влез оттук' : 'Регистрирай се тук';
        }

        window.handleAuth = async function() {
            const email = document.getElementById('email-input').value.trim();
            const password = document.getElementById('password-input').value;
            
            if(!email || !password) return alert("Моля попълнете имейл и парола!");

            try {
                if(isRegisterMode) {
                    const nickname = document.getElementById('nickname-input').value.trim();
                    const age = document.getElementById('age-input').value;
                    const gender = document.getElementById('gender-input').value;
                    const info = document.getElementById('info-input').value.trim() || "Няма информация.";
                    const avatar = document.getElementById('avatar-input').value.trim() || 'https://dicebear.com' + nickname;
                    
                    if(!nickname || !age) return alert("Попълнете никнейм и години!");

                    // 1. Регистрация във Firebase Auth
                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    const user = userCredential.user;
                    
                    // Задаване на роля
                    const role = (email.toLowerCase() === 'admin@amoreclub.net') ? 'admin' : 'user';

                    myProfile = { uid: user.uid, email, nickname, age, gender, info, avatar, role };

                    // 2. Записване на профила в базата данни Firestore
                    await setDoc(doc(db, "users", user.uid), myProfile);
                    
                } else {
                    // Логин
                    const userCredential = await signInWithEmailAndPassword(auth, email, password);
                    const user = userCredential.user;
                    
                    // Взимане на допълнителните данни от Firestore
                    const userDoc = await getDoc(doc(db, "users", user.uid));
                    if(userDoc.exists()) {
                        myProfile = userDoc.data();
                    } else {
                        myProfile = { nickname: user.email.split('@')[0], role: "user", age: "—", gender: "—", info: "Няма информация.", avatar: 'https://dicebear.comAmore' };
                    }
                }

                // Преминаване към чата
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('chat-screen').classList.remove('hidden');
                document.getElementById('user-badge').innerText = `@${myProfile.nickname} (${myProfile.role})`;

                // Свързване на потребителя със Socket.io сървъра
                socket.emit('join-verified-user', myProfile);

            } catch (error) {
                alert("Възникна грешка: " + error.message);
            }
        }

        window.sendMessage = function() {
            const input = document.getElementById('message-input');
            const msg = input.value.trim();
            if(!msg) return;
            socket.emit('chat-message', msg);
            input.value = "";
        }

        socket.on('broadcast-message', (data) => {
            const container = document.getElementById('messages-container');
            const msgDiv = document.createElement('div');
            const isMe = data.user === myProfile.nickname;

            if(!isMe) document.getElementById('msg-sound').play().catch(()=>{});

            msgDiv.className = `max-w-[75%] p-3.5 rounded-2xl text-sm ${
                isMe ? 'bg-gradient-to-r from-purple-600 to-pink-600 text-white self-end rounded-tr-none' : 'bg-slate-800 text-slate-100 self-start rounded-tl-none border border-slate-700/40'
            } ${data.role === 'admin' ? 'border-2 border-red-500 shadow-lg shadow-red-500/10' : ''}`;

            msgDiv.innerHTML = `<button onclick="window.openProfileCard('${data.user}', '${data.role}')" class="block text-[10px] font-extrabold uppercase tracking-wider opacity-70 mb-1 hover:underline text-purple-300 text-left">${data.user} ${data.role==='admin'?'👑':''}</button>${data.text}`;
            
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        });

        socket.on('system-message', (text) => {
            const container = document.getElementById('messages-container');
            const sysDiv = document.createElement('div');
            sysDiv.className = "text-center text-xs text-purple-400/50 my-2 tracking-wide font-medium italic";
            sysDiv.innerText = text;
            container.appendChild(sysDiv);
            container.scrollTop = container.scrollHeight;
        });

        // Функция за отваряне на профил и админ бутони при клик на име
        window.openProfileCard = async function(username, role) {
            activeProfileView = username;
            document.getElementById('modal-name').innerText = username + (role === 'admin' ? ' 👑 (Админ)' : '');
            document.getElementById('modal-avatar').src = 'https://dicebear.com' + username;
            
            document.getElementById('modal-age').innerText = `Години: VIP Член`;
            document.getElementById('modal-gender').innerText = `Пол: Скрит`;
            document.getElementById('modal-info').innerText = `Потребител в стаята на Amore Club.`;

            if(myProfile && myProfile.role === 'admin' && username !== myProfile.nickname) {
                document.getElementById('admin-controls').classList.remove('hidden');
            } else {
                document.getElementById('admin-controls').classList.add('hidden');
            }

            document.getElementById('profile-modal').classList.remove('hidden');
        }

        window.closeProfile = function() {
            document.getElementById('profile-modal').classList.add('hidden');
        }

        window.adminAction = function(action) {
            if(!activeProfileView) return;
            socket.emit('admin-action', { action: action, targetName: activeProfileView });
            closeProfile();
        }

        socket.on('kick-user', () => {
            alert("🚨 Бяхте изгонен или блокиран от Администратора!");
            location.reload();
        });
    </script>
</body>
</html>
